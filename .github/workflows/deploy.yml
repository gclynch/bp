name: CI Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
    
    - name: Test Coverage
      run: dotnet test --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          **/TestResults/**/*
          **/*.trx
    - name: Install Security Scanner
      run: dotnet tool install --global dotnet-security-scan
      
    - name: Security Scan
      run: dotnet-security-scan --directory .
      
    - name: Install Code Analysise
      run: |
        dotnet add package SonarAnalyzer.CSharp
        dotnet add package SecurityCodeScan
        
    - name: Run Code Analysis
      run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true
