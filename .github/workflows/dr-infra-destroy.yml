# Deletes the DR site. Run it by hand from the Actions tab and type "destroy" to confirm.

name: DR Infra Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  dr-infra-destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: DR-Automation

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - name: Terraform destroy
        run: terraform destroy -auto-approve

      # runs from the repo root, because the job default is DR-Automation
      - name: Slack - DR destroy result
        if: always()
        working-directory: .
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$JOB_STATUS" = "success" ]; then
            title="🗑️ DR site destroyed"
            message="DR destroy by *$GITHUB_ACTOR*: the DR plan and web app in Spain Central are deleted."
          else
            title="❌ DR destroy failed"
            message="DR destroy by *$GITHUB_ACTOR* did not finish, so some DR resources may still exist. Check the run."
          fi
          bash .github/scripts/slack-notify.sh "$title" "$message" \
            "View run=$run_url"
