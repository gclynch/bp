# Deletes the DR site. Run it by hand from the Actions tab and type "destroy" to confirm.

name: DR Infra Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  dr-infra-destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: DR-Automation

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - name: Terraform destroy
        run: terraform destroy -auto-approve
